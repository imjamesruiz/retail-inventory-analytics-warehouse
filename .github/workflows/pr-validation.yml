name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests dashboard

      - name: Ruff format check
        run: ruff format --check src tests dashboard

      - name: Unit tests
        run: pytest tests/unit -v

  dbt-parse:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dbt]"

      - name: dbt deps
        working-directory: dbt_inventory
        run: dbt deps

      - name: dbt parse (validates YAML/Jinja/ref graph, no warehouse needed)
        working-directory: dbt_inventory
        env:
          SNOWFLAKE_ACCOUNT: placeholder
          SNOWFLAKE_USER: placeholder
          SNOWFLAKE_PASSWORD: placeholder
        run: dbt parse --profiles-dir .

  dbt-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Only runs when Snowflake secrets are configured on the repo -- see
    # docs/architecture.md for the one-time setup. PRs from forks (which
    # never see secrets) still get full coverage from dbt-parse above.
    if: ${{ secrets.SNOWFLAKE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,dbt]"

      - name: Write Snowflake key-pair private key
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: Ingest fixtures
        env:
          DATA_SOURCE_MODE: fixture
          RAW_STORAGE_BACKEND: local
          RAW_DATA_PATH: ./data/ci-raw
        run: python -m inventory_pipeline.cli ingest --source-mode fixture --backfill-days 3

      - name: Load into Snowflake
        env:
          RAW_STORAGE_BACKEND: local
          RAW_DATA_PATH: ./data/ci-raw
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: python -m inventory_pipeline.cli load-snowflake

      - name: dbt build (against a CI-only dev schema)
        working-directory: dbt_inventory
        env:
          DBT_TARGET: ci
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA_ANALYTICS: CI_ANALYTICS
        run: dbt build --profiles-dir .
