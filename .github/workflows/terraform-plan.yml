name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init (providers only, no backend)
        working-directory: terraform
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  plan:
    runs-on: ubuntu-latest
    needs: fmt-and-validate
    # Runs only once the backend/OIDC role/Snowflake secrets below are
    # configured on the repo (see the Terraform section of the README) --
    # fmt/validate above cover config correctness on every PR regardless,
    # including from forks that never see secrets.
    if: ${{ secrets.AWS_CI_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Write Snowflake key-pair private key
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=retail-inventory-analytics-warehouse/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      # Read-only: this role (modules.iam.github_actions_ci_role_arn) has no
      # write permissions on AWS resources, so `apply` isn't possible from
      # CI even if someone added the step. Applies are run manually, locally.
      - name: terraform plan
        working-directory: terraform
        env:
          TF_VAR_raw_bucket_name: ${{ secrets.TF_VAR_RAW_BUCKET_NAME }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_state_bucket_arn: ${{ secrets.TF_STATE_BUCKET_ARN }}
          TF_VAR_lock_table_arn: ${{ secrets.TF_LOCK_TABLE_ARN }}
          SNOWFLAKE_ORGANIZATION_NAME: ${{ secrets.SNOWFLAKE_ORGANIZATION_NAME }}
          SNOWFLAKE_ACCOUNT_NAME: ${{ secrets.SNOWFLAKE_ACCOUNT_NAME }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: terraform plan -no-color -input=false
