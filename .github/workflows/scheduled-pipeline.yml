name: Scheduled Pipeline

on:
  schedule:
    # Daily at 13:00 UTC. Adjust to taste -- this is a portfolio project, not
    # a production system, so a lower frequency keeps warehouse credit usage
    # near zero.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      source_mode:
        description: "Data source mode"
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - live

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Requires Snowflake secrets -- see docs/architecture.md for one-time setup.
    if: ${{ secrets.SNOWFLAKE_ACCOUNT != '' }}
    env:
      SOURCE_MODE: ${{ github.event.inputs.source_mode || 'fixture' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev,dbt]"

      - name: Write Snowflake key-pair private key
        run: |
          printf '%s' "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: Ingest
        env:
          DATA_SOURCE_MODE: ${{ env.SOURCE_MODE }}
          RAW_STORAGE_BACKEND: local
          RAW_DATA_PATH: ./data/scheduled-raw
          WALMART_API_KEY: ${{ secrets.WALMART_API_KEY }}
        run: |
          if [ "$SOURCE_MODE" = "live" ]; then
            python -m inventory_pipeline.cli ingest --source-mode live
          else
            python -m inventory_pipeline.cli ingest --source-mode fixture --backfill-days 1
          fi

      - name: Load into Snowflake
        env:
          RAW_STORAGE_BACKEND: local
          RAW_DATA_PATH: ./data/scheduled-raw
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: python -m inventory_pipeline.cli load-snowflake

      - name: dbt build
        # No `continue-on-error` -- a failing test here means bad data
        # reached the warehouse, and that should fail the run visibly
        # rather than let a broken dashboard ship silently.
        working-directory: dbt_inventory
        env:
          DBT_TARGET: ci
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA_ANALYTICS: ${{ secrets.SNOWFLAKE_SCHEMA_ANALYTICS }}
        run: dbt build --profiles-dir .

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_id }}
          path: |
            data/scheduled-raw/**/manifest.json
            dbt_inventory/target/run_results.json
            dbt_inventory/logs/dbt.log
          retention-days: 14
