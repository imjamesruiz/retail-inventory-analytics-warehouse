[project]
name = "retail-inventory-analytics-warehouse"
version = "0.1.0"
description = "ELT pipeline for retail inventory and pricing analytics: Python extraction, Snowflake warehousing, dbt transformation, Streamlit dashboard."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "click>=8.1",
    "python-dotenv>=1.0",
    "snowflake-connector-python[pandas]>=3.11",
    "boto3>=1.34",
    "structlog>=24.1",
    "streamlit>=1.36",
    "pandas>=2.2",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "moto>=5.0",
    "pre-commit>=3.7",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-snowflake>=1.8",
]

[project.scripts]
inventory-pipeline = "inventory_pipeline.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live Snowflake/AWS/network credentials",
]
