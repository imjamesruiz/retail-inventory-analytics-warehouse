version: 2

models:
  - name: stg_inventory_events
    description: >
      One row per raw inventory observation, renamed/cast/standardized from
      raw.inventory_events. No deduplication and no business logic.
    columns:
      - name: event_id
        tests:
          - not_null
          - unique
      - name: source_name
        description: Standardized retailer code.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["TARGET", "WALMART", "POKEMON_CENTER", "GAMESTOP"]
      - name: inventory_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["IN_STOCK", "OUT_OF_STOCK", "PREORDER", "BACKORDER", "UNKNOWN"]
      - name: currency
        tests:
          - accepted_values:
              arguments:
                values: ["USD"]
      - name: price
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: quantity_available
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: observed_at
        tests:
          - not_null

  - name: stg_ingestion_runs
    description: One row per extraction run manifest, renamed/cast/standardized.
    columns:
      - name: run_id
        tests:
          - not_null
          - unique
      - name: status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["SUCCESS", "PARTIAL_FAILURE", "FAILED", "UNKNOWN"]

  - name: stg_products
    description: Tracked-product catalog (from seed_products.csv).
    columns:
      - name: product_id
        tests:
          - not_null
          - unique
      - name: retailer
        tests:
          - not_null

  - name: stg_retailers
    description: Retailer reference data (from seed_retailers.csv).
    columns:
      - name: retailer_code
        tests:
          - not_null
          - unique
